name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate (Node ${{ matrix.node-version }}, AI SDK ${{ matrix.ai-sdk-major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 20
            ai-sdk-major: 6
            ai-version: ^6.0.13
          - node-version: 22
            ai-sdk-major: 7
            ai-version: ^7.0.0

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Select AI SDK ${{ matrix.ai-sdk-major }}
        run: pnpm pkg set "devDependencies.ai=${{ matrix.ai-version }}"

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Check unused
        run: pnpm knip

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run
